name: Content Services Tests
on:
  push:
    branches: ["develop", "staging"]
  pull_request:
    branches: ["develop", "staging"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.25"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        working-directory: ./content_services
        run: uv run pytest --no-cov -rsfE
