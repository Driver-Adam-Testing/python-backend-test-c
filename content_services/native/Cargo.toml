[package]
name = "analytics_native"
version = "0.1.0"
edition = "2021"
description = "Native Rust extension for analytics tree size calculation"

[lib]
name = "analytics_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
git2 = "0.18"
rayon = "1.8"
bytecount = "0.6"
thiserror = "1.0"
once_cell = "1.19"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.0"

[profile.release]
lto = true
codegen-units = 1
