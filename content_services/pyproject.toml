[project]
name = "hatchet-python"
version = "0.1.0"
description = "Run Hatchet Workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-secretsmanager-caching>=1.1.3,<2.0.0",
    "openai==1.99.1",
    "tiktoken>=0.12.0,<0.13.0",
    "tqdm>=4.66.4,<5.0.0",
    "boto3>=1.34.141,<2.0.0",
    "database",
    "pydantic[email]>=2.12.4,<3.0.0",
    "pydantic-settings>=2.3.3,<3.0.0",
    "pymupdf>=1.25.5,<2.0.0",
    "pymupdf4llm==0.0.17",
    "google-genai>=1.9.0,<2.0.0",
    "shared",
    "duckdb>=1.1.0,<2.0.0",
    "pyarrow>=18.0.0,<19.0.0",
    "pandas>=2.0.0,<3.0.0",
    "chardet>=5.2.0,<6.0.0",
    "requests>=2.32.3,<3.0.0",
    "sendgrid>=6.11.0,<7.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "tree-sitter-c==0.23.4",
    "tree-sitter-cpp==0.23.2",
    "tree-sitter-java>=0.23.5,<0.24.0",
    "tree-sitter-c-sharp>=0.23.1,<0.24.0",
    "tree-sitter-typescript>=0.23.2,<0.24.0",
    "pillow>=10.4.0,<11.0.0",
    "modal>=1.0.4,<2.0.0",
    "aiolimiter>=1.2.1,<2.0.0",
    "tree-sitter>=0.25.1,<0.26.0",
    "tree-sitter-go>=0.25.0,<0.26.0",
    "tree-sitter-python>=0.25.0,<0.26.0",
    "pygit2>=1.18.2,<2.0.0",
    "notion-client>=2.4.0,<3.0.0",
    "sentry-sdk>=2.0.0,<3.0.0",
    "hatchet-sdk==1.20.0",
    "greenlet>=3.2.4,<4.0.0",
    "auth0-python>=4.13.0,<5.0.0",
    "truststore>=0.10.4,<0.11.0",
    "tree-sitter-ruby>=0.23.1,<0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2,<9.0.0",
    "moto[all,ec2,s3]>=5.0.9,<6.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "ipython>=8.26.0,<9.0.0",
]

[project.scripts]
simple = "src.run:main"
worker = "src.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
database = { workspace = true }
shared = { workspace = true }

[tool.poetry]
name = "hatchet-python"
version = "0.1.0"
description = "Run Hatchet Workflows"
authors = ["driver"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
database = {path = "../packages/driver_db", develop = true}
shared = {path = "../packages/shared", develop = true}

[tool.poetry.scripts]
simple = "src.run:main"
worker = "src.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
