[project]
name = "onboarding-event-handler"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34.130,<2.0.0",
    "httpx>=0.28.0,<0.29.0",
    "pydantic>=2.7.4,<3.0.0",
    "pydantic-settings>=2.3.3,<3.0.0",
    "aws-secretsmanager-caching>=1.1.3,<2.0.0",
    "sentry-sdk>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "moto[all,ec2,s3]>=5.0.9,<6.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
