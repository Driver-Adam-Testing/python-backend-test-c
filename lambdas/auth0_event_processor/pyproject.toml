[project]
name = "auth0-event-processor"
version = "0.1.0"
description = "Lambda function to process Auth0 webhook events from SQS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-secretsmanager-caching>=1.1.3,<2.0.0",
    "boto3>=1.40.52,<2.0.0",
    "hatchet-sdk==1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
]

[tool.uv]
package = false
